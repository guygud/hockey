<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Шайба: идеальный проезд</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="game-blur" aria-hidden="true"></canvas>

  <div id="hud">
    <div class="hud-top">
      <div class="hud-cluster">
        <div class="hud-box hearts-box" id="lives-box">
          <span class="heart filled" data-i="0"></span>
          <span class="heart filled" data-i="1"></span>
          <span class="heart filled" data-i="2"></span>
        </div>
        <div class="hud-center hud-stats">
          <span class="hud-stat">ур : <b id="level-num">1</b><span id="level-mul" hidden></span></span>
          <span class="hud-stat hud-speed"><i class="hud-puck-ico"></i><b id="speed">0.0</b> км/ч</span>
        </div>
      </div>
      <button id="pause-btn" type="button" class="pause-btn" aria-label="Пауза" hidden></button>
    </div>

    <div class="hud-bottom">
      <div class="controls-hint">
        <span>держи ← →</span>
        <span>↑ прыжок</span>
      </div>
      <div id="touch-controls">
        <button type="button" class="touch-btn touch-btn-left" data-input="left" aria-label="Влево"></button>
        <button type="button" class="touch-btn touch-btn-center" data-input="brace" aria-label="Прыжок"></button>
        <button type="button" class="touch-btn touch-btn-right" data-input="right" aria-label="Вправо"></button>
      </div>
    </div>

    <div id="brace-flash" hidden></div>
    <div id="status" hidden></div>
    <button id="restart-btn" type="button" hidden>Ещё раз</button>
    <button id="report-alt" type="button" class="ghost-btn" hidden></button>

    <div id="pause-overlay" hidden>
      <div class="pause-panel">
        <div class="pause-title">ПАУЗА</div>
        <button id="resume-btn" type="button">Продолжить</button>
      </div>
    </div>

    <div id="rating-overlay" hidden>
      <div class="rating-panel">
        <div class="rating-title">Рейтинг</div>
        <div class="rating-you">
          <div id="rating-name"></div>
          <div id="rating-score"></div>
        </div>
        <ol class="rating-list" id="rating-list"></ol>
        <div class="rating-place" id="rating-place" hidden></div>
        <div class="rating-error" id="rating-error" hidden>Рейтинг недоступен</div>
        <button id="rating-restart" type="button">Начать заново</button>
      </div>
    </div>

    <div id="intro">
      <div class="intro-panel">
      <h1>Идеальный проезд</h1>
      <p class="intro-sub">Клюшки стоят на трассе. Боковые объезжай, перекрещенные перепрыгивай, синие ворота лови. Держи стрелки, чтобы рулить.</p>
      <p class="intro-keys"><span>держи ← влево</span><span>↑ прыжок</span><span>держи → вправо</span></p>
      <button id="start-btn" type="button">Поехали</button>
      </div>
    </div>
  </div>

  <a class="back-link" href="../">← К играм</a>
  <script type="module" src="src/main.js?v=5"></script>
</body>
</html>
